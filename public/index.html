<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SAP 客户订货商城</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section id="auth" class="auth-shell">
      <h1>SAP 客户订货商城</h1>
      <p>登录后，仅可选择具有 A305 / PR00 有效价格的物料。</p>
      <div id="auth-message" role="alert" aria-live="polite"></div>

      <section id="login-panel">
        <form id="login-form">
          <input id="customer" inputmode="numeric" placeholder="SAP 客户号" required>
          <input id="password" type="password" autocomplete="current-password" placeholder="门户密码" required>
          <button id="login-button">登录</button>
        </form>
        <button id="show-register" type="button" class="link-button">首次使用？开户注册</button>
      </section>

      <section id="register-request-panel" hidden>
        <h2>开户注册</h2>
        <p>验证码将发送到 SAP 客户主数据维护的邮箱。开发环境请在服务端日志中查看验证码。</p>
        <form id="register-request-form">
          <input id="register-customer" inputmode="numeric" placeholder="SAP 客户号" required>
          <button id="request-code-button">获取验证码</button>
        </form>
        <button type="button" class="link-button back-to-login">返回登录</button>
      </section>

      <section id="register-verify-panel" hidden>
        <h2>设置门户密码</h2>
        <form id="register-verify-form">
          <input id="verify-customer" inputmode="numeric" placeholder="SAP 客户号" required readonly>
          <input id="verification-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" required>
          <input id="register-password" type="password" autocomplete="new-password" minlength="12" placeholder="设置至少 12 位门户密码" required>
          <button id="verify-button">完成注册</button>
        </form>
        <button type="button" class="link-button back-to-login">返回登录</button>
      </section>
    </section>

    <section id="portal" hidden>
      <header class="store-header">
        <a class="brand" href="#catalog">SAP 客户订货商城</a>
        <nav aria-label="主导航">
          <a href="#catalog">商品目录</a>
          <a href="#checkout">我的订单</a>
          <a href="#customer-summary">客户中心</a>
        </nav>
        <button id="logout" type="button" class="text-button">退出登录</button>
      </header>
      <div id="portal-message" role="alert" aria-live="polite"></div>

      <div class="store-layout">
        <aside class="sidebar" id="customer-summary" aria-label="客户信息"></aside>
        <section id="catalog" aria-label="商品目录">
          <div class="catalog-heading">
            <div><p class="eyebrow">商品目录</p><h1>有效价格物料</h1><p id="catalog-count">加载中…</p></div>
            <div class="catalog-filters"><label>销售范围<select id="sales-area-select" aria-label="销售范围"></select></label><label>排序<select id="catalog-sort"><option value="material">按物料号</option><option value="price">按价格</option></select></label></div>
          </div>
          <form id="catalog-search-form" class="catalog-search">
            <input id="catalog-search" type="search" placeholder="搜索物料号或物料描述" autocomplete="off">
            <button>搜索</button>
          </form>
          <div id="material-groups" class="material-groups" aria-label="物料组导航"></div>
          <div id="catalog-grid" class="catalog-grid" aria-live="polite"></div>
          <div id="catalog-pagination" class="pagination" aria-label="分页"></div>
        </section>
        <aside id="cart-panel" class="cart-panel" aria-label="购物车">
          <div class="cart-title"><div><p class="eyebrow">当前订单</p><h2>购物车 <span id="cart-count">0</span></h2></div></div>
          <div id="cart-items"></div>
          <div class="cart-footer"><p id="cart-total">合计 ¥0.00</p><button id="checkout-button" disabled>去结算</button></div>
        </aside>
      </div>

      <section id="checkout" class="checkout-panel" hidden>
        <div><p class="eyebrow">订单确认</p><h2>补充订单信息</h2><p>提交前将重新校验价格和物料可售性。</p></div>
        <form id="checkout-form">
          <label>期望交货日期<input id="requested-delivery-date" type="date"></label>
          <label>客户采购订单号 / 参考号<input id="purchase-order-by-customer" maxlength="35" placeholder="可选"></label>
          <label class="wide">订单备注<textarea id="portal-note" maxlength="500" placeholder="可选，最多 500 字"></textarea></label>
          <div class="checkout-actions"><button type="button" id="back-to-cart-button" class="text-button">返回购物车</button><button>查看订单摘要</button></div>
        </form>
      </section>
    </section>
  </main>

  <dialog id="order-confirmation-dialog" aria-labelledby="order-confirmation-title">
    <h2 id="order-confirmation-title">确认同步至 SAP</h2>
    <div id="order-confirmation-summary"></div>
    <div class="dialog-actions"><button id="cancel-order-button" type="button" class="text-button">返回修改</button><button id="confirm-order-button" type="button">确认并同步至 SAP</button></div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
