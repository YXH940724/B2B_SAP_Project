<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAP 客户下单</title><link rel="stylesheet" href="/styles.css"></head><body><main><section id="login"><h1>SAP 客户下单</h1><p>使用客户号登录后，仅可选择具有 A305 / ZR01 有效价格的物料。</p><form id="login-form"><input id="customer" placeholder="SAP 客户号" required><input id="password" type="password" placeholder="门户密码" required><button>登录</button></form></section><section id="portal" hidden><header><h1>客户下单</h1><p id="customer-info"></p></header><form id="product-form"><input id="product" placeholder="物料号，例如 1386" required><input id="quantity" type="number" min="1" value="1" required><button>查询并加入</button></form><div id="message" role="alert"></div><table><thead><tr><th>物料</th><th>单价</th><th>数量</th><th>金额</th><th></th></tr></thead><tbody id="cart"></tbody></table><p id="total">合计：0</p><button id="submit" disabled>确认并同步到 SAP</button></section></main><script src="/app.js"></script></body></html>
